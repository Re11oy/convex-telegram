name: Release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # A release is only tagged from a commit that passes this gate.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: this workflow publishes.
      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm format:check

  release-please:
    name: Release PR
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the release PR branch, create tags and releases
      issues: write # create and update the release PR labels
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Updates the release PR; merging it tags the release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # If this fails after tagging, fix the cause and re-run the failed job.
  publish:
    name: Stage on npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the npm trusted publisher (release.yml, environment npm).
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Staging only: a maintainer publishes with `npm stage approve` (2FA).
      # Prereleases (0.2.0-alpha.0) get their own dist-tag instead of `latest`.
      - name: Stage for publishing
        run: |
          version=$(node -p 'require("./package.json").version')
          tag=latest
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            tag="${prerelease%%.*}"
          fi
          npm stage publish --provenance --tag "$tag"
          {
            echo "Staged convex-telegram@$version (dist-tag \`$tag\`)."
            echo
            echo "Publish: \`npm stage list convex-telegram\`, then \`npm stage approve <stage-id>\` (npm 11.15+)."
          } >> "$GITHUB_STEP_SUMMARY"
