allowBuilds:
  esbuild: true

# Only install versions published at least 14 days ago (matches Renovate).
# Override once with `pnpm install --config.minimumReleaseAge=0`.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Types only; Renovate applies a 3-day wait to it instead.
  - "@gramio/types"
# If no old-enough version satisfies a range (e.g. the @vitest/* siblings of a
# security fix), use the newer one and add it to minimumReleaseAgeExclude.
minimumReleaseAgeStrict: false
